<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gasolineras</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⛽ Buscar gasolineras</h1>

  <div class="panel-superior">
    <div class="buscador">
      
      <select id="provincia">
        <option value="">Selecciona provincia</option>
      </select><br>

      <div class="autocomplete">
        <input
          type="text"
          id="localidad"
          list="listaLocalidades"
          placeholder="Escribe una población"
          autocomplete="off"
        />
        <datalist id="listaLocalidades"></datalist>
        <div id="sugerenciasLocalidad" class="sugerencias"></div>
      </div>

      <input
        type="text"
        id="cp"
        placeholder="Codigo postal"
        maxlength="5"
        inputmode="numeric"
        pattern="[0-9]*"
      />

      <div class="filtro-distancia">
        <label for="distanciaMax">
          Distancia maxima: <span id="valorDistancia">10</span> km
        </label>
        <input type="range" id="distanciaMax" min="1" max="20" value="10">
      </div>

      <div class="filtro-prioridad">
        <label>Prioridad</label>
        <span id="textoPrioridad">Equilibrado</span>

        <div class="slider-labels">
          <span>📍 Distancia</span>
          <input type="range" id="prioridadScore" min="0" max="100" value="50">
          <span>💸 Precio</span>
        </div>
      </div>

      <div class="filtro-combustible">
        <label>Combustible</label>
        <div class="botones-combustible">
          <button type="button" class="combustible-btn active" data-combustible="diesel" aria-pressed="true">
            🟢 Gasoleo A
          </button>
          <button type="button" class="combustible-btn" data-combustible="95" aria-pressed="false">
            🟡 Gasolina 95
          </button>
          <button type="button" class="combustible-btn" data-combustible="98" aria-pressed="false">
            🔴 Gasolina 98
          </button>
        </div>
      </div>

      <button id="buscar">🔎 Buscar</button>
    </div>

    <div id="favoritasInicio">
      <h2 class="favoritasInicio">
        ❤️ Tus gasolineras favoritas
        <button id="toggleFavoritas" class="btn-toggle" type="button">▼</button>
      </h2>
      <p id="descripcionFavoritas" class="descripcion">
        Aún no tienes favoritas. Añade alguna gasolinera para tenerla siempre a mano.
      </p>
      <div id="listaFavoritasInicio" ></div>
    </div>
  </div>

  <div id="controlesOrden" class="controles-orden" style="display: none;">
    <button id="orden-asc">💸 Mas barato</button>
    <button id="orden-desc">💰 Mas caro</button>
    <button id="orden-distancia">📍 Mas cercano</button>
  </div>

  <div id="resultados"></div>
  <button id="btnSubir" class="btn-subir">↑</button>
  <script type="module" src="js/main.js"></script>
</body>
</html>
